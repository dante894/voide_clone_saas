# Blueprint de Render (Infraestructura como código).
# https://render.com/docs/blueprint-spec
#
# En el dashboard de Render: "New" -> "Blueprint" -> conectá este repo.
# Render va a leer este archivo y crear el servicio web + la base de datos.
#
# IMPORTANTE: no escales este servicio a más de 1 instancia. La generación
# de audio corre en un hilo en segundo plano DENTRO del mismo proceso web
# (ver worker.py); con 2+ instancias cada una tendría su propia cola y el
# resultado sería impredecible. Como además usamos un disco persistente,
# Render ya bloquea el escalado horizontal y los despliegues sin downtime
# por diseño, así que esto queda resuelto solo.

services:
  - type: web
    name: estudio-de-voz
    runtime: python
    plan: standard          # el plan free de Render (512 MB RAM) no alcanza para XTTS-v2
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT"
    healthCheckPath: /login
    disk:
      name: estudio-de-voz-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
      - key: APP_BASE_URL
        value: https://estudio-de-voz.onrender.com   # actualizá esto con tu URL real de Render
      - key: DATABASE_URL
        fromDatabase:
          name: estudio-de-voz-db
          property: connectionString
      - key: MP_ACCESS_TOKEN
        sync: false     # lo cargás vos a mano en el Dashboard (secreto)
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_PLAN_ID
        sync: false      # lo obtenés corriendo scripts/crear_plan_mercadopago.py
      - key: MP_PRO_PRICE_ARS
        value: "9999"
      - key: GOOGLE_CLIENT_ID
        sync: false      # opcional: consola de Google Cloud -> Credenciales
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false       # ej: "vos@tuemail.com,socio@tuemail.com"

databases:
  - name: estudio-de-voz-db
    plan: basic-256mb
