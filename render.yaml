# Blueprint de Render (Infraestructura como código).
# https://render.com/docs/blueprint-spec
#
# En el dashboard de Render: "New" -> "Blueprint" -> conectá este repo.
# Render va a leer este archivo y crear el servicio web + la base de datos.
#
# IMPORTANTE: no escales este servicio a más de 1 instancia. La cola de
# generación (worker.py) vive en memoria dentro de un solo proceso; con 2+
# instancias cada una tendría su propia cola y el resultado sería
# impredecible.
#
# La generación de audio en sí NO corre acá: se delega a un Hugging Face
# Space (ver hf_space/) que sí tiene la RAM necesaria para XTTS-v2. Por eso
# este servicio puede vivir cómodo en el plan Free de Render.

services:
  - type: web
    name: estudio-de-voz
    runtime: python
    plan: free               # alcanza de sobra: ya no se carga el modelo acá
    region: oregon
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT"
    healthCheckPath: /login
    # Si más adelante querés que las voces sobrevivan a los redeploys, subí
    # este servicio a un plan pago (Starter o superior) y agregá un disco
    # persistente acá, con DATA_DIR=/var/data. En el plan Free, Render no
    # permite discos, así que las voces guardadas se pierden en cada
    # redeploy — aceptable mientras estás probando.
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        value: https://estudio-de-voz.onrender.com   # actualizá esto con tu URL real de Render
      - key: DATABASE_URL
        fromDatabase:
          name: estudio-de-voz-db
          property: connectionString
      - key: HF_SPACE_URL
        sync: false      # ej: https://tuusuario-estudio-de-voz.hf.space
      - key: HF_SPACE_SECRET
        sync: false      # el mismo valor que configuraste como Secret en el Space
      - key: MP_ACCESS_TOKEN
        sync: false     # lo cargás vos a mano en el Dashboard (secreto)
      - key: MP_PUBLIC_KEY
        sync: false
      - key: MP_PLAN_ID
        sync: false      # lo obtenés corriendo scripts/crear_plan_mercadopago.py
      - key: MP_PRO_PRICE_ARS
        value: "9999"
      - key: GOOGLE_CLIENT_ID
        sync: false      # opcional: consola de Google Cloud -> Credenciales
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false       # ej: "vos@tuemail.com,socio@tuemail.com"

databases:
  - name: estudio-de-voz-db
    plan: basic-256mb
